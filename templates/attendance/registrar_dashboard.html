{% extends 'attendance/base.html' %}
{% block content %}
{% block sidebar %}
{% include "attendance/sidebar.html" %}
{% endblock %}

<style>
    .page-header-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        gap: 1rem;
        background: #ffffff;
        padding: 1.25rem 1.5rem;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
    }
    .header-title-group {
        display: flex;
        align-items: center;
        gap: 0.85rem;
    }
    .header-title-group h2 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--text-main);
    }
    .header-icon-box {
        width: 42px;
        height: 42px;
        border-radius: var(--radius-sm);
        background: rgba(37, 99, 235, 0.1);
        color: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
    }
    .action-group {
        display: flex;
        gap: 0.75rem;
        align-items: center;
    }

    /* Metric Cards Grid */
    .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.25rem;
        margin-bottom: 2rem;
    }
    .metric-card {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: var(--transition);
    }
    .metric-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }
    .metric-info h5 {
        margin: 0 0 0.5rem 0;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }
    .metric-value {
        font-size: 2.25rem;
        font-weight: 800;
        color: var(--text-main);
        line-height: 1;
    }
    .metric-icon {
        width: 54px;
        height: 54px;
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
    }

    /* Icon Theme Tints */
    .icon-students { background: rgba(37, 99, 235, 0.1); color: #2563eb; }
    .icon-teachers { background: rgba(16, 185, 129, 0.1); color: #10b981; }
    .icon-courses  { background: rgba(14, 165, 233, 0.1); color: #0ea5e9; }
    .icon-streams  { background: rgba(245, 158, 11, 0.1); color: #d97706; }
</style>

<!-- Header Toolbar -->
<div class="page-header-actions">
    <div class="header-title-group">
        <div class="header-icon-box">
            <i class="fas fa-user-graduate"></i>
        </div>
        <h2>Registrar Dashboard</h2>
    </div>
</div>

<!-- Metrics Overview Cards -->
<div class="metrics-grid">
    <div class="metric-card">
        <div class="metric-info">
            <h5>Total Students</h5>
            <div class="metric-value">{{ total_students }}</div>
        </div>
        <div class="metric-icon icon-students">
            <i class="fas fa-user-graduate"></i>
        </div>
    </div>

    <div class="metric-card">
        <div class="metric-info">
            <h5>Total Teachers</h5>
            <div class="metric-value">{{ total_teachers }}</div>
        </div>
        <div class="metric-icon icon-teachers">
            <i class="fas fa-chalkboard-teacher"></i>
        </div>
    </div>

    <div class="metric-card">
        <div class="metric-info">
            <h5>Courses</h5>
            <div class="metric-value">{{ total_courses }}</div>
        </div>
        <div class="metric-icon icon-courses">
            <i class="fas fa-book"></i>
        </div>
    </div>

    <div class="metric-card">
        <div class="metric-info">
            <h5>Streams</h5>
            <div class="metric-value">{{ total_streams }}</div>
        </div>
        <div class="metric-icon icon-streams">
            <i class="fas fa-layer-group"></i>
        </div>
    </div>
</div>

{% endblock %}
